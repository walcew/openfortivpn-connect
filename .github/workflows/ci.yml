name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust toolchain
        # shortcut: Rust fixado em 1.99 porque o layout de build do Cargo 1.100 quebra o tauri-build 2.5.6 ("Is a directory"); voltar para stable quando o tauri-build suportar o novo layout
        uses: dtolnay/rust-toolchain@1.99

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # O prebuild do npm compila o helper em release, que o tauri_build exige
      # como bundle.resources; o build gera também o dist (frontendDist).
      - name: Build frontend
        run: npm run build

      - name: Test Rust workspace
        run: cargo test --workspace
        working-directory: src-tauri
