name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync project identity
        run: |
          cd src-tauri
          cargo build -p openvpngui --quiet
          set -a
          # shellcheck disable=SC1091
          source ../project.env
          set +a
          echo "PRODUCT_NAME=$PRODUCT_NAME" >> "$GITHUB_ENV"
          echo "HELPER_CRATE_NAME=$HELPER_CRATE_NAME" >> "$GITHUB_ENV"
          echo "HELPER_BINARY_NAME=$HELPER_BINARY_NAME" >> "$GITHUB_ENV"
          echo "REPOSITORY_SLUG=$REPOSITORY_SLUG" >> "$GITHUB_ENV"
          echo "HOMEBREW_CASK=$HOMEBREW_CASK" >> "$GITHUB_ENV"
          echo "HOMEBREW_TAP_REPO=$HOMEBREW_TAP_REPO" >> "$GITHUB_ENV"
          echo "DMG_ASSET_PATTERN=$DMG_ASSET_PATTERN" >> "$GITHUB_ENV"

      - name: Upload project.env
        if: matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: project-env
          path: project.env

      - name: Build bundled openfortivpn
        run: |
          case "${{ matrix.arch }}" in
            aarch64) ./scripts/build-openfortivpn.sh arm64 ;;
            x86_64) ./scripts/build-openfortivpn.sh x86_64 ;;
            *) echo "Unsupported arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

      - name: Build helper binary
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }} -p "${HELPER_CRATE_NAME}"
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/${HELPER_BINARY_NAME}" "target/release/${HELPER_BINARY_NAME}"

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (uncomment when ready):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: ${{ env.PRODUCT_NAME }} v__VERSION__
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' }}
          prerelease: false
          args: '--target ${{ matrix.target }}'

  checksums:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # For workflow_dispatch, get the latest draft release tag
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release DMGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.dmg" \
            --dir ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.dmg > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            ./artifacts/checksums-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  dispatch-homebrew:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download project.env
        uses: actions/download-artifact@v4
        with:
          name: project-env

      - name: Trigger Homebrew tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -a
          # shellcheck disable=SC1091
          source ./project.env
          set +a
          VERSION="${{ needs.checksums.outputs.tag }}"
          VERSION="${VERSION#v}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            "https://api.github.com/repos/${HOMEBREW_TAP_REPO}/dispatches" \
            -d "{
              \"event_type\": \"update-cask\",
              \"client_payload\": {
                \"cask\": \"${HOMEBREW_CASK}\",
                \"version\": \"$VERSION\",
                \"repo\": \"${REPOSITORY_SLUG}\",
                \"asset_pattern\": \"${DMG_ASSET_PATTERN}\"
              }
            }"
