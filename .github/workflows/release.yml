name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Validate the build only: no release, no checksums, DMGs as workflow artifacts'
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            ofv_arch: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            ofv_arch: x86_64
    runs-on: ${{ matrix.platform }}
    env:
      # O beforeBuildCommand do Tauri roda build:openfortivpn sem argumento; sem isso o script
      # usaria a arquitetura do host (arm64) e sobrescreveria o binário x86_64 do job cruzado.
      OPENFORTIVPN_ARCH: ${{ matrix.ofv_arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build helper binary
        run: |
          cd src-tauri
          cargo build --release --target ${{ matrix.target }} -p openvpngui-helper
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/openvpngui-helper target/release/openvpngui-helper

      - name: Build bundled openfortivpn
        run: |
          # Só dependência de build; o script não usa o OpenSSL do Homebrew.
          brew install autoconf automake
          scripts/build-openfortivpn.sh "${{ matrix.ofv_arch }}"

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # O prebuild roda `cargo build --release` sem --target; sem isto ele compila o helper para o
          # host (arm64) e sobrescreve o target/release/openvpngui-helper copiado no passo anterior.
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          # Code signing (uncomment when ready):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Sem tagName o tauri-action só compila, sem criar release (dry_run).
          tagName: ${{ inputs.dry_run != true && 'v__VERSION__' || '' }}
          releaseName: ${{ inputs.dry_run != true && 'OpenFortiVpn Connect v__VERSION__' || '' }}
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' }}
          prerelease: false
          args: '--target ${{ matrix.target }}'

      # Depois do Tauri: o prebuild dele pode sobrescrever o helper com o do host.
      - name: Verify bundled binary architectures
        run: |
          lipo src-tauri/binaries/openfortivpn -verify_arch ${{ matrix.ofv_arch }}
          lipo src-tauri/target/release/openvpngui-helper -verify_arch ${{ matrix.ofv_arch }}

      - name: Upload DMGs (dry run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  checksums:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # For workflow_dispatch, get the latest draft release tag
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release DMGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.dmg" \
            --dir ./artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.dmg > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            ./artifacts/checksums-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  dispatch-homebrew:
    needs: checksums
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Homebrew tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.checksums.outputs.tag }}"
          VERSION="${VERSION#v}"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
            "https://api.github.com/repos/walcew/homebrew-tap/dispatches" \
            -d "{
              \"event_type\": \"update-cask\",
              \"client_payload\": {
                \"cask\": \"openfortivpn-connect\",
                \"version\": \"$VERSION\",
                \"repo\": \"walcew/openfortivpn-connect\",
                \"asset_pattern\": \"OpenFortiVpn.Connect_{version}_{arch}.dmg\"
              }
            }"
